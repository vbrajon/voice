<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice</title>
<style>
  * { box-sizing: border-box; margin: 0 }
  html, body { height: 100% }
  body { font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #111; z-index: 2; text-align: center; padding: 1rem; white-space: pre-wrap }
  #mic { flex: 1; display: grid; place-items: center; background: none; border: 0; color: #eee; cursor: pointer }
  #mic svg { width: 40vmin; height: 40vmin; transition: .2s }
  #mic.rec svg { color: #e33; animation: pulse 1s infinite alternate }
  #mic.busy { opacity: .4; pointer-events: none }
  @keyframes pulse { to { transform: scale(1.1) } }
  body.chat #mic { flex: 0 0 6rem }
  body.chat #mic svg { width: 4rem; height: 4rem }
  #devices { position: fixed; inset: 0; display: none; place-items: center; background: #000c; z-index: 1 }
  #devices.open { display: grid }
  #devices div { background: #222; padding: 1rem; border-radius: .5rem; min-width: 18rem }
  #devices button { display: block; width: 100%; text-align: left; padding: .6rem; margin: .3rem 0; background: #333; border: 0; color: #eee; border-radius: .3rem; cursor: pointer }
  #chat { display: none; flex: 1; flex-direction: column; min-height: 0 }
  body.chat #chat { display: flex }
  #bar { display: flex; gap: .5rem; padding: .5rem; align-items: center; border-bottom: 1px solid #333 }
  #bar select, #bar button, #text { padding: .4rem; background: #222; color: #eee; border: 1px solid #444; border-radius: .3rem }
  #log { flex: 1; overflow: auto; padding: .5rem }
  #log p { background: #222; padding: .5rem .8rem; border-radius: .6rem; margin: .4rem 0; max-width: 40rem }
  #log small { display: block; color: #9c9; margin-top: .2rem }
  form { display: flex; gap: .5rem; padding: .5rem; border-top: 1px solid #333 }
  #text { flex: 1 }
</style>

<div id="status">Connecting…</div>

<button id="mic" title="Click to talk">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/>
  </svg>
</button>

<div id="devices"><div>Choose a microphone</div></div>

<div id="chat">
  <div id="bar">
    <select id="from"></select> → <select id="to"></select>
    <button id="translate">Translate</button>
    <span id="mt"></span>
  </div>
  <div id="log"></div>
  <form id="form"><input id="text" placeholder="Type a message…" autocomplete="off"><button>Send</button></form>
</div>

<script type="module">
  const $ = id => document.getElementById(id)
  // nemo-speech server: `nemo-speech serve --asr-model nemotron-3.5 --nmt-model riva-translate-4b-instruct-v2.q8_0.gguf --cors-origin https://vbrajon.github.io`
  const API = new URLSearchParams(location.search).get('api') || 'https://guitars-jimmy-bicycle-interested.trycloudflare.com'

  async function api(path, body) {
    const init = body instanceof FormData ? { method: 'POST', body } : body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}
    const json = await (await fetch(API + path, init)).json()
    if (json.error) throw new Error(json.error.message)
    return json
  }

  // 1. On entry: check the server has the voice model loaded
  try {
    const { data } = await api('/v1/models')
    if (!data.some(m => m.capability === 'transcription')) throw new Error('no ASR model loaded')
    $('status').remove()
  } catch (e) {
    $('status').textContent = `Can't reach ${API} (${e.message})\n\nStart it with:\nnemo-speech serve --asr-model nemotron-3.5 --cors-origin ${location.origin}`
  }

  // 2. Fullscreen mic: pick a device, then toggle recording
  let deviceId, recorder
  $('mic').onclick = async () => {
    if (recorder) return recorder.stop()
    if (!deviceId) return pickDevice()
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: deviceId } } })
    const chunks = []
    recorder = new MediaRecorder(stream)
    recorder.ondataavailable = e => chunks.push(e.data)
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop())
      recorder = null
      $('mic').className = 'busy'
      try {
        const ctx = new AudioContext({ sampleRate: 16000 })
        const buf = await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer())
        const form = new FormData()
        form.append('file', wav(buf.getChannelData(0)), 'audio.wav')
        form.append('language', 'auto')
        form.append('response_format', 'verbose_json')
        const { text, language } = await api('/v1/audio/transcriptions', form)
        if (language?.slice(0, 2) in LANGS) $('from').value = language.slice(0, 2)
        if (text.trim()) say(text.trim())
      } catch (e) {
        console.warn(e)
      }
      $('mic').className = ''
    }
    recorder.start()
    $('mic').className = 'rec'
  }

  // 16 kHz mono PCM16 WAV, the only upload format the server accepts
  function wav(f32) {
    const b = new DataView(new ArrayBuffer(44 + f32.length * 2))
    const tag = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)))
    tag(0, 'RIFF'); b.setUint32(4, 36 + f32.length * 2, true); tag(8, 'WAVE')
    tag(12, 'fmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true)
    b.setUint32(24, 16000, true); b.setUint32(28, 32000, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true)
    tag(36, 'data'); b.setUint32(40, f32.length * 2, true)
    f32.forEach((v, i) => b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true))
    return new Blob([b], { type: 'audio/wav' })
  }

  async function pickDevice() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    stream.getTracks().forEach(t => t.stop())
    const box = $('devices').firstElementChild
    for (const d of await navigator.mediaDevices.enumerateDevices()) {
      if (d.kind !== 'audioinput') continue
      const b = box.appendChild(document.createElement('button'))
      b.textContent = d.label || d.deviceId
      b.onclick = () => { deviceId = d.deviceId; $('devices').remove(); $('mic').click() }
    }
    $('devices').className = 'open'
  }

  // 3. Chat with whole-conversation translation
  function say(text) {
    document.body.className = 'chat'
    const p = $('log').appendChild(document.createElement('p'))
    p.textContent = text
    p.scrollIntoView()
  }

  $('form').onsubmit = e => { e.preventDefault(); if ($('text').value.trim()) say($('text').value.trim()); $('text').value = '' }

  for (const [code, name] of Object.entries(LANGS)) {
    $('from').add(new Option(name, code))
    $('to').add(new Option(name, code))
  }
  $('to').value = 'fr'

  // Riva Translate only knows en↔X pairs: pivot through English otherwise
  async function translate(texts, from, to) {
    if (from === to) return texts
    if (from !== 'en' && to !== 'en') { texts = await translate(texts, from, 'en'); from = 'en' }
    const { translations } = await api('/v1/translations', { input: texts, source_language: from, target_language: to })
    return translations.map(t => t.text)
  }

  $('translate').onclick = async () => {
    $('mt').textContent = 'Translating…'
    try {
      const ps = [...$('log').children]
      const out = await translate(ps.map(p => p.firstChild.textContent), $('from').value, $('to').value)
      ps.forEach((p, i) => {
        p.querySelector('small')?.remove()
        p.appendChild(document.createElement('small')).textContent = out[i]
      })
      $('mt').textContent = ''
    } catch (e) {
      $('mt').textContent = e.message
    }
  }
</script>
